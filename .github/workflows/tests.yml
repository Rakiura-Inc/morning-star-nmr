name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: run every notebook against live Zenodo to catch link rot
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pip install "rakiura @ git+https://github.com/Rakiura-Inc/rakiura-py@main"
      - run: python -m pytest -q
  notebooks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: RAKIURA_LIVE=0 python scripts/run_notebooks.py
